[package]
name = "prompt-to-pan-desktop"
version = "1.1.0"
description = "Prompt to Pan — desktop companion for Windows, macOS, and Linux"
edition = "2021"

[[bin]]
name = "prompt-to-pan"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
rfd = "0.15"
keepawake = "0.6"
base64 = "0.22"
open = "5"
