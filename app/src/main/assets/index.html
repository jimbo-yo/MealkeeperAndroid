<body><div class="app" id="app" data-sites-preview-theme>
<header class="topbar"><div class="brand"><div class="brand-icon">♨</div> mealkeeper</div><div class="top-actions"><span class="chip">✦ AI-ready recipe library</span><button class="primary" onclick="openImport()">＋ Import recipes</button></div></header>
<div class="layout"><aside><div class="nav-label">YOUR KITCHEN</div><button class="nav-btn active" data-page="home" onclick="go('home')"><span class="ico">⌂</span> Overview</button><button class="nav-btn" data-page="meals" onclick="go('meals')"><span class="ico">▦</span> Meal collections</button><button class="nav-btn" data-page="shopping" onclick="go('shopping')"><span class="ico">☷</span> Shopping list <span class="badge" style="margin-left:auto">12</span></button><button class="nav-btn" data-page="timeline" onclick="go('timeline')"><span class="ico">◷</span> Cooking timeline</button><div class="nav-label" style="margin-top:22px">TOOLS</div><button class="nav-btn" data-page="prompt" onclick="go('prompt')"><span class="ico">✧</span> AI export prompt</button><button class="nav-btn" data-page="settings" onclick="go('settings')"><span class="ico">⚙</span> Settings</button><div class="side-card"><strong>✦ Made with AI, kept in one place</strong>Import recipes from ChatGPT, Claude, or any AI that can follow your export format.</div></aside>
<main class="main" id="main"></main></div>
<nav class="mobile-nav"><button data-page="home" class="active" onclick="go('home')"><span>⌂</span>Home</button><button data-page="meals" onclick="go('meals')"><span>▦</span>Meals</button><button data-page="shopping" onclick="go('shopping')"><span>☷</span>List</button><button data-page="timeline" onclick="go('timeline')"><span>◷</span>Timeline</button><button data-page="settings" onclick="go('settings')"><span>⚙</span>Settings</button></nav>
<div class="toast" id="toast"></div><div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div></div>
<script>
const meals=[{id:1,name:'Sunday Italian supper',desc:'A relaxed family meal with a shared prep plan.',emoji:'🍝',art:'pasta',tag:'THIS WEEKEND',time:'55 min',count:3,servings:3,recipes:[['🍅','Roasted tomato bruschetta','Starter · 15 min'],['🍝','Sausage & pepper rigatoni','Main · 35 min'],['🍋','Lemon ricotta cups','Dessert · 10 min']]},{id:2,name:'Weeknight quinoa bowls',desc:'Flexible bowls with roasted vegetables and a bright dressing.',emoji:'🥗',art:'',tag:'WEEKDAY FAVORITE',time:'30 min',count:2,servings:3,recipes:[['🥣','Herby quinoa base','Base · 20 min'],['🥦','Roasted veg & tahini sauce','Toppings · 25 min']]},{id:3,name:'Cozy autumn dinner',desc:'A warming, oven-friendly meal with minimal hands-on time.',emoji:'🍲',art:'soup',tag:'MAKE AHEAD',time:'1 hr 10',count:3,servings:4,recipes:[['🍗','Braised chicken thighs','Main · 50 min'],['🎃','Maple roasted squash','Side · 30 min'],['🥬','Garlicky greens','Side · 10 min']]},{id:4,name:'Taco night',desc:'Build-your-own tacos with a simple prep sequence.',emoji:'🌮',art:'taco',tag:'QUICK & EASY',time:'35 min',count:3,servings:3,recipes:[['🌮','Smoky beef tacos','Main · 25 min'],['🥑','Avocado lime salsa','Topping · 10 min'],['🌽','Chili-lime corn','Side · 12 min']]}];
let page='home',selectedMeal=1,mealTab='recipes',checked=new Set(),awake=false,importText='',detailRecipe=0;
const shopping=[{name:'Italian sausage links',qty:'1 lb',group:'Meat & seafood'},{name:'Rigatoni pasta',qty:'12 oz',group:'Pantry'},{name:'Bell peppers',qty:'2',group:'Produce'},{name:'Cherry tomatoes',qty:'1 pint',group:'Produce'},{name:'Fresh basil',qty:'1 bunch',group:'Produce'},{name:'Ricotta cheese',qty:'1 cup',group:'Dairy'},{name:'Lemons',qty:'2',group:'Produce'},{name:'Olive oil',qty:'as needed',group:'Pantry'},{name:'Garlic',qty:'1 bulb',group:'Produce'},{name:'Parmesan',qty:'½ cup',group:'Dairy'},{name:'Balsamic glaze',qty:'1 small bottle',group:'Pantry'},{name:'Heavy cream',qty:'½ cup',group:'Dairy'}];
function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}function notify(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>t.style.display='none',2500)}function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modal-bg').style.display='flex'}function closeModal(){document.getElementById('modal-bg').style.display='none'}function openImport(){openModal(`<h2>Import AI-generated recipes</h2><p class="subhead" style="margin-bottom:12px">Paste the structured export from ChatGPT, Claude, or another assistant. You can also load the sample to explore the flow.</p><label class="field-label">Recipe export (JSON or readable format)</label><textarea id="import-area" class="field" placeholder="Paste your recipe export here…" rows="7">${escapeHtml(importText)}</textarea><div class="actions" style="margin-top:12px"><button class="secondary" onclick="document.getElementById('import-area').value=sampleExport">Load sample export</button><button class="outline" onclick="go('prompt');closeModal()">Get export prompt</button></div><div class="modal-foot"><button class="outline" onclick="closeModal()">Cancel</button><button class="primary" onclick="doImport()">Import recipes →</button></div>`)}
function doImport(){let v=document.getElementById('import-area').value.trim();if(!v){notify('Paste an export or load the sample first.');return}importText=v;let parsed;try{parsed=JSON.parse(v)}catch(e){}if(parsed&&parsed.meals&&parsed.meals.length){parsed.meals.forEach((m,i)=>meals.push({id:Date.now()+i,name:m.name||'Imported meal',desc:m.description||'Imported AI meal collection.',emoji:'🍽️',art:'',tag:'IMPORTED',time:m.total_time||'—',count:(m.recipes||[]).length,servings:m.servings||3,recipes:(m.recipes||[]).map(r=>['🍴',r.title||r.name||'Recipe',`Recipe · ${r.total_time||'time varies'}`])}));closeModal();notify(`Imported ${parsed.meals.length} meal collection(s).`);go('meals')}else{closeModal();notify('Export saved in this prototype. Try the sample JSON for a full import.')}}
const sampleExport=JSON.stringify({format:'mealkeeper-v1',meals:[{name:'AI imported: Mediterranean bowls',description:'A bright make-ahead dinner.',servings:3,total_time:'35 min',recipes:[{title:'Lemon herb chicken',total_time:'25 min'},{title:'Cucumber tomato salad',total_time:'10 min'}]}]},null,2);
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mealCard(m){return `<article class="meal-card" onclick="openMeal(${m.id})"><div class="meal-art ${m.art}"><span class="art-tag">${m.tag}</span><span class="art-emoji">${m.emoji}</span></div><div class="meal-content"><h3>${escapeHtml(m.name)}</h3><p>${escapeHtml(m.desc)}</p><div class="meta"><span>◷ ${m.time} &nbsp;·&nbsp; ${m.count} recipes</span><span class="mini-avatars"><span class="avatar">🍽</span><span class="avatar">☷</span><span class="avatar">◷</span></span></div></div></article>`}
function home(){return `<div class="eyebrow">YOUR RECIPE WORKSPACE</div><div class="spread" style="align-items:flex-start"><div><h1 class="headline">What are we cooking?</h1><p class="subhead">Your AI-created recipes, meal plans, and shopping lists — all together.</p></div><button class="primary" onclick="go('prompt')">✧ Generate AI prompt</button></div><div class="stats"><div class="stat"><div class="number">${meals.length}</div><div class="label">Meal collections</div></div><div class="stat"><div class="number">${meals.reduce((a,m)=>a+m.count,0)}</div><div class="label">Recipes organized</div></div><div class="stat"><div class="number">${shopping.length-checked.size}</div><div class="label">Items to shop for</div></div></div><div class="section-head"><h2>Recent meal collections</h2><button class="text-btn" onclick="go('meals')">View all →</button></div><div class="meal-grid">${meals.slice(0,4).map(mealCard).join('')}</div><div class="section-head"><h2>Pick up where you left off</h2><button class="text-btn" onclick="go('timeline')">Open timeline →</button></div><div class="panel"><div class="row"><div class="recipe-icon">◷</div><div style="flex:1"><strong style="font-size:14px">Sunday Italian supper</strong><div class="muted small" style="margin-top:5px">Start with the bruschetta · 55 min total</div></div><button class="secondary" onclick="openMeal(1)">Open meal</button></div></div><div class="panel"><div class="spread"><div class="row"><div class="recipe-icon">☷</div><div><strong style="font-size:14px">Shopping list</strong><div class="muted small" style="margin-top:5px">${checked.size} of ${shopping.length} items checked</div></div></div><button class="outline" onclick="go('shopping')">View list</button></div><div style="height:7px;background:light-dark(#e8eae2,#30372f);border-radius:9px;margin-top:16px;overflow:hidden"><div style="width:${checked.size/shopping.length*100}%;height:100%;background:#66845b;border-radius:9px"></div></div></div>`}
function mealsPage(){return `<div class="eyebrow">YOUR COLLECTIONS</div><div class="spread" style="align-items:flex-start"><div><h1 class="headline">Meal collections</h1><p class="subhead">Keep every course, recipe, shopping item, and cooking step together.</p></div><button class="primary" onclick="newMeal()">＋ New meal</button></div><div class="meal-grid">${meals.map(mealCard).join('')}</div>`}
function newMeal(){openModal(`<h2>Create a meal collection</h2><p class="subhead">Start a collection, then import AI-generated recipes into it.</p><label class="field-label">Meal name</label><input class="field" id="new-name" placeholder="e.g. Friday night dinner"><label class="field-label">Description</label><input class="field" id="new-desc" placeholder="Optional note about the meal"><div class="modal-foot"><button class="outline" onclick="closeModal()">Cancel</button><button class="primary" onclick="addMeal()">Create collection</button></div>`)}function addMeal(){let n=document.getElementById('new-name').value.trim();if(!n){notify('Give your meal a name first.');return}meals.unshift({id:Date.now(),name:n,desc:document.getElementById('new-desc').value||'A new meal collection.',emoji:'🍽️',art:'',tag:'NEW COLLECTION',time:'—',count:0,servings:3,recipes:[]});closeModal();openMeal(meals[0].id)}
function openMeal(id){selectedMeal=id;mealTab='recipes';page='meal';render()}function mealPage(){let m=meals.find(m=>m.id===selectedMeal)||meals[0];return `<button class="text-btn" onclick="go('meals')">← All meal collections</button><div style="height:15px"></div><div class="eyebrow">MEAL COLLECTION</div><div class="spread" style="align-items:flex-start"><div><h1 class="headline">${escapeHtml(m.name)}</h1><p class="subhead">${escapeHtml(m.desc)}</p><div class="row muted small">◷ ${m.time} &nbsp;·&nbsp; ${m.recipes.length} recipes &nbsp;·&nbsp; Serves ${m.servings}</div></div><button class="outline" onclick="openImport()">＋ Import recipes</button></div><div class="tabs"><button class="tab ${mealTab==='recipes'?'active':''}" onclick="mealTab='recipes';render()">Recipes (${m.recipes.length})</button><button class="tab ${mealTab==='shopping'?'active':''}" onclick="mealTab='shopping';render()">Shopping list</button><button class="tab ${mealTab==='timeline'?'active':''}" onclick="mealTab='timeline';render()">Cooking timeline</button></div>${mealTab==='recipes'?`<div class="section-head" style="margin-top:12px"><h2>Courses & recipes</h2><button class="text-btn" onclick="go('prompt')">✧ AI export format</button></div><div class="recipe-list">${m.recipes.length?m.recipes.map((r,i)=>`<div class="recipe-row" onclick="showRecipe(${i})"><div class="recipe-icon">${r[0]}</div><div><h3>${escapeHtml(r[1])}</h3><p>${escapeHtml(r[2])}</p></div><span class="arrow">›</span></div>`).join(''):`<div class="panel empty"><div style="font-size:34px;margin-bottom:12px">🥘</div><strong>No recipes yet</strong><p class="small">Import a recipe bundle from your AI, and all the courses will appear here.</p><button class="primary" onclick="openImport()">Import recipes</button></div>`}</div>`:mealTab==='shopping'?shoppingPage(true):timelinePage(true)}<div class="actions" style="margin-top:20px"><button class="secondary" onclick="go('shopping')">☷ Open full shopping list</button><button class="secondary" onclick="go('timeline')">◷ Plan cooking order</button></div>`}
function showRecipe(i){let m=meals.find(m=>m.id===selectedMeal),r=m.recipes[i];openModal(`<div class="eyebrow">${escapeHtml(m.name)}</div><h2>${escapeHtml(r[1])}</h2><p class="subhead">${escapeHtml(r[2])}</p><div class="panel"><strong>Recipe details</strong><p class="muted small" style="line-height:1.6">This prototype shows recipe navigation and collection structure. Imported full recipe content can include ingredients, quantities, step-by-step instructions, prep time, cook time, and notes.</p></div><div class="actions"><button class="secondary" onclick="closeModal();go('shopping')">View shopping list</button><button class="secondary" onclick="closeModal();go('timeline')">Cooking timeline</button></div><div class="modal-foot"><button class="primary" onclick="closeModal()">Done</button></div>`)}
function shoppingPage(embedded=false){let groups=[...new Set(shopping.map(x=>x.group))];return `${embedded?'':'<div class="eyebrow">READY FOR THE STORE</div><h1 class="headline">Shopping list</h1><p class="subhead">One consolidated list for the whole meal. Check items off as you shop.</p>'}<div class="panel"><div class="spread"><div><strong>${shopping.length-checked.size} items left</strong><div class="muted small" style="margin-top:4px">${checked.size} of ${shopping.length} checked</div></div><div class="actions"><button class="outline" onclick="clearChecks()">Uncheck all</button><button class="secondary" onclick="copyList()">Copy list</button></div></div><div style="height:6px;background:light-dark(#e7e9e0,#30372f);border-radius:9px;margin-top:15px;overflow:hidden"><div style="height:100%;width:${checked.size/shopping.length*100}%;background:#66845b"></div></div></div>${groups.map(g=>`<div class="panel"><div class="spread"><h3 style="font-size:15px;margin:0">${g}</h3><span class="muted small">${shopping.filter(x=>x.group===g).length} items</span></div>${shopping.map((x,i)=>({...x,i})).filter(x=>x.group===g).map(x=>`<label class="checkrow ${checked.has(x.i)?'checked':''}"><input type="checkbox" ${checked.has(x.i)?'checked':''} onchange="toggleItem(${x.i},this.checked)"><span class="checktext">${x.name}</span><span class="qty">${x.qty}</span></label>`).join('')}</div>`).join('')}`}
function toggleItem(i,v){if(v)checked.add(i);else checked.delete(i);render()}function clearChecks(){checked.clear();render()}function copyList(){let s=shopping.map((x,i)=>`${checked.has(i)?'[x]':'[ ]'} ${x.name} — ${x.qty}`).join('\n');if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>notify('Shopping list copied')).catch(()=>notify('List ready to copy'));else notify('List ready to copy')}
function timelinePage(embedded=false){return `${embedded?'':'<div class="eyebrow">COOKING MODE</div><h1 class="headline">Cooking timeline</h1><p class="subhead">A coordinated order of operations so courses finish at the right time.</p>'}<div class="panel"><div class="spread"><div><strong>Sunday Italian supper</strong><div class="muted small" style="margin-top:4px">Target serving time: 6:30 PM · 55 min total</div></div><span class="badge">3 courses</span></div><label class="field-label">Target serving time</label><input class="field" type="time" value="18:30" onchange="notify('Serving time updated for this session')"></div><div class="panel"><div class="timeline"><div class="time">5:35 PM</div><div class="timeitem"><strong>Prep everything</strong><p>Wash produce, mince garlic, slice peppers, and set out ingredients.</p></div><div class="time">5:45 PM</div><div class="timeitem"><strong>Start the sausage & pepper sauce</strong><p>Brown sausage, soften peppers, add tomatoes, then simmer while pasta water heats.</p></div><div class="time">6:00 PM</div><div class="timeitem"><strong>Prepare bruschetta</strong><p>Toast bread and mix tomatoes, basil, olive oil, and garlic. Keep separate until serving.</p></div><div class="time">6:05 PM</div><div class="timeitem"><strong>Boil pasta</strong><p>Cook rigatoni until al dente. Reserve a cup of pasta water before draining.</p></div><div class="time">6:15 PM</div><div class="timeitem"><strong>Finish and plate the main</strong><p>Toss pasta with sauce and parmesan. Set bruschetta out as the first course.</p></div><div class="time">6:25 PM</div><div class="timeitem"><strong>Finish lemon ricotta cups</strong><p>Add lemon zest and a little honey; garnish and chill until dessert.</p></div><div class="time">6:30 PM</div><div class="timeitem"><strong>Serve dinner</strong><p>Starter first, then the pasta. Dessert is ready to serve after the main.</p></div></div><div class="divider"></div><div class="spread"><span class="muted small">Keep this screen awake while cooking</span><button class="secondary" onclick="go('settings')">Configure</button></div></div>`}
function promptPage(){let prompt=`You are a recipe and meal-planning assistant. Return your complete answer as valid JSON only, using the Mealkeeper format below. Do not wrap the JSON in Markdown fences or add commentary outside it. Preserve every recipe in the meal as a separate recipe, and include a combined shopping list and an ordered cooking timeline. Use consistent units and quantities. If a value is unknown, use null rather than inventing it.\n\nSchema example:\n${sampleExport}\n\nFor each recipe, include: id, title, course, servings, prep_time_minutes, cook_time_minutes, total_time_minutes, ingredients (array of {name, quantity, unit, notes}), instructions (ordered array of strings), make_ahead_notes, and source. At meal level include name, description, servings, total_time, recipes, shopping_list (array of {name, quantity, unit, category, used_in}), and timeline (array of {start_offset_minutes, duration_minutes, task, recipe_id, instructions}). Combine duplicate shopping ingredients where practical, but retain which recipes use each item. Ensure the JSON is syntactically valid and follows format: mealkeeper-v1.`;return `<div class="eyebrow">CONNECT YOUR AI TO MEALKEEPER</div><h1 class="headline">AI export prompt</h1><p class="subhead">Copy this prompt into ChatGPT, Claude, or another AI after asking it to create your meal. It requests a consistent structure that keeps recipes, ingredients, and timing connected.</p><div class="panel"><div class="spread"><div class="row"><div class="recipe-icon">✧</div><div><strong>Mealkeeper JSON format</strong><div class="muted small" style="margin-top:4px">Version 1 · Structured recipes + shared list + timeline</div></div></div><span class="badge">v1</span></div><label class="field-label">Copy-ready instruction prompt</label><textarea class="field" id="prompt-text" rows="15" readonly>${escapeHtml(prompt)}</textarea><div class="actions" style="margin-top:14px"><button class="primary" onclick="copyPrompt()">▣ Copy prompt</button><button class="secondary" onclick="openImport()">↥ Import AI response</button></div></div><div class="panel"><h3 style="margin:0 0 8px;font-size:16px">What this format preserves</h3>${[['▦','Meal grouping','One meal object holds all its courses and recipes.'],['☷','Combined shopping list','Quantities, categories, and which recipes use each item.'],['◷','Cooking timeline','Relative start offsets and durations for coordinating dishes.'],['↗','Portability','Plain JSON can be saved, pasted, or generated by different AI assistants.']].map(x=>`<div class="row" style="padding:11px 0"><div class="recipe-icon" style="width:38px;height:38px;font-size:17px">${x[0]}</div><div><strong style="font-size:13px">${x[1]}</strong><div class="muted small" style="margin-top:4px">${x[2]}</div></div></div>`).join('')}</div><div class="panel"><h3 style="font-size:16px;margin:0 0 7px">Suggested workflow</h3><p class="muted small" style="line-height:1.7">1. Copy the prompt.<br>2. Ask your AI to create a complete meal and follow the format.<br>3. Copy the JSON response.<br>4. Select <strong>Import recipes</strong> and paste it here.</p><button class="primary" onclick="openImport()">Import recipes →</button></div>`}
function copyPrompt(){let t=document.getElementById('prompt-text').value;if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>notify('AI export prompt copied')).catch(()=>notify('Select and copy the prompt text'));else{document.getElementById('prompt-text').select();notify('Select and copy the prompt text')}}
function settingsPage(){return `<div class="eyebrow">PREFERENCES</div><h1 class="headline">Settings</h1><p class="subhead">Tune your cooking experience and recipe import behavior.</p><div class="panel"><div class="spread"><div class="row"><div class="recipe-icon">☀</div><div><strong>Keep screen awake</strong><div class="muted small" style="margin-top:5px">Prevent the display from sleeping while following recipes.</div></div></div><input class="toggle" type="checkbox" ${awake?'checked':''} onchange="setAwake(this.checked)"></div><div class="divider"></div><p class="muted small" style="line-height:1.6">In this interactive preview, the setting is simulated. A real Android app would use a screen-on window flag while cooking mode is active, and release it when you leave.</p></div><div class="panel"><div class="row"><div class="recipe-icon">↥</div><div style="flex:1"><strong>Import recipes</strong><div class="muted small" style="margin-top:4px">Paste a Mealkeeper JSON export generated by an AI assistant.</div></div><button class="secondary" onclick="openImport()">Import</button></div><div class="divider"></div><div class="row"><div class="recipe-icon">✧</div><div style="flex:1"><strong>Export format prompt</strong><div class="muted small" style="margin-top:4px">Generate the instruction to use with your AI.</div></div><button class="secondary" onclick="go('prompt')">Open prompt</button></div></div><div class="panel"><h3 style="font-size:16px;margin:0 0 8px">Data in this prototype</h3><p class="muted small" style="line-height:1.6">Demo meals and checklist state are held in this preview session. Production Android app should store imported recipes locally, validate JSON before importing, and offer backup/export.</p></div>`}
function setAwake(v){awake=v;if(window.MealkeeperAndroid&&window.MealkeeperAndroid.setKeepScreenOn){window.MealkeeperAndroid.setKeepScreenOn(v)}render();notify(v?'Keep screen awake enabled':'Keep screen awake disabled')}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let html=page==='home'?home():page==='meals'?mealsPage():page==='meal'?mealPage():page==='shopping'?`<div class="eyebrow">READY FOR THE STORE</div><h1 class="headline">Shopping list</h1><p class="subhead">One consolidated list for the whole meal. Check items off as you shop.</p>${shoppingPage()}`:page==='timeline'?timelinePage():page==='prompt'?promptPage():settingsPage();document.getElementById('main').innerHTML=html}
render();
</script></body></html>
