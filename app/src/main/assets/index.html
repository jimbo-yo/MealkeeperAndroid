<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Prompt to Pan</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand"><svg class="brand-icon" viewBox="20 20 68 68" aria-hidden="true"><g transform="translate(54 54) scale(0.8) translate(-54 -54)"><g transform="translate(51 69.5) scale(1.2) translate(-54 -66.5)"><path fill="#F6EFE1" d="M32.5 54 H75.5 A2.5 2.5 0 0 1 78 56.5 V56.5 A2.5 2.5 0 0 1 75.5 59 H32.5 A2.5 2.5 0 0 1 30 56.5 V56.5 A2.5 2.5 0 0 1 32.5 54 Z M33 58 H75 V68 Q75 79 64 79 H44 Q33 79 33 68 Z M28.0 60 H31.0 A2.5 2.5 0 0 1 33.5 62.5 V62.5 A2.5 2.5 0 0 1 31.0 65 H28.0 A2.5 2.5 0 0 1 25.5 62.5 V62.5 A2.5 2.5 0 0 1 28.0 60 Z M77.0 60 H80.0 A2.5 2.5 0 0 1 82.5 62.5 V62.5 A2.5 2.5 0 0 1 80.0 65 H77.0 A2.5 2.5 0 0 1 74.5 62.5 V62.5 A2.5 2.5 0 0 1 77.0 60 Z"/></g><path d="M46 53.5 C41 49.83 51 47.20 46 43.00" fill="none" stroke="#F6EFE1" stroke-width="3.4" stroke-linecap="round"/><path d="M55 52.5 C60 49.52 50 47.40 55 44.00" fill="none" stroke="#F6EFE1" stroke-width="3.4" stroke-linecap="round"/><path fill="#D2704A" d="M64 22 H74 Q81 22 81 29 V34 Q81 41 74 41 H67 L58 48 L61 40.6 Q57 39 57 34 V29 Q57 22 64 22 Z"/><path fill="#F6EFE1" d="M69 25.2 C69.756 29.61 70.89 30.744 75.3 31.5 C70.89 32.256 69.756 33.39 69 37.8 C68.244 33.39 67.11 32.256 62.7 31.5 C67.11 30.744 68.244 29.61 69 25.2 Z"/></g></svg><span><span class="brand-prompt">Prompt</span> to Pan</span></div>
      <div class="top-actions">
        <button class="primary" onclick="openImport()">＋ Import recipes</button>
      </div>
    </header>

    <!-- Filled in by render() in app.js. -->
    <main class="main" id="main"></main>

    <nav class="mobile-nav">
      <button data-page="home" class="active" onclick="go('home')"><span>⌂</span>Home</button>
      <button data-page="chat" onclick="go('chat')"><span>✦</span>Chat</button>
      <button data-page="meals" onclick="go('meals')"><span>▦</span>Meals</button>
      <button data-page="shopping" onclick="go('shopping')"><span>☷</span>List</button>
      <button data-page="timeline" onclick="go('timeline')"><span>◷</span>Timeline</button>
      <button data-page="settings" onclick="go('settings')"><span>⚙</span>Settings</button>
    </nav>

    <div class="toast" id="toast"></div>
    <div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal" id="modal"></div>
    </div>
  </div>

  <script src="demo-data.js"></script>
  <script src="chat.js"></script>
  <script src="app.js"></script>
</body>
</html>
